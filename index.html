<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Calculus Sandbox by ช่างเบิร์ด</title>
    <style>
        :root {
            --primary: #10b981; /* สีเขียวชาวสวน */
            --bg: #f3f4f6;
            --card: #ffffff;
            --text: #1f2937;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background: var(--card);
            width: 100%;
            max-width: 400px; /* พอดีจอ iPhone */
            border-radius: 16px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            padding: 20px;
            box-sizing: border-box;
        }
        h2 {
            margin-top: 0;
            font-size: 1.25rem;
            color: var(--primary);
            text-align: center;
            border-bottom: 2px dashed #e5e7eb;
            padding-bottom: 10px;
        }
        .panel {
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 8px;
        }
        input[type="range"] {
            width: 100%;
            accent-color: var(--primary);
        }
        .result-box {
            display: flex;
            justify-content: space-between;
            background: var(--primary);
            color: white;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            margin-top: 10px;
        }
        .credit {
            font-size: 0.75rem;
            text-align: center;
            color: #6b7280;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>ฟาร์มแคลคูลัส (Calculus Sandbox) 🌿</h2>
    
    <!-- Panel A: Input Kernel -->
    <div class="panel">
        <label>ฟังก์ชัน: f(x) = x² + 2x</label>
        <label for="x-slider" style="margin-top: 15px;">ปรับค่า x: <span id="x-val">0.00</span></label>
        <input type="range" id="x-slider" min="-5" max="5" step="0.1" value="0">
    </div>

    <!-- Panel C: Visualizer & Result -->
    <div class="panel">
        <label>ผลลัพธ์แบบ Real-time ⚡</label>
        <div class="result-box">
            <span>ค่าฟังก์ชัน f(x):</span>
            <span id="fx-result">0.00</span>
        </div>
        <div class="result-box" style="background: #3b82f6;">
            <span>ความชัน (Derivative):</span>
            <span id="dx-result">2.00</span>
        </div>
    </div>

    <div class="credit">
        ขับเคลื่อนโดย Tri-Core Meta-Engine<br>
        สถาปัตยกรรมโดย ช่างเบิร์ด<br>
        อุทิศแด่ มทร.ล้านนา & Jimmy Software
    </div>
</div>

<script>
    // Panel B: Live Calculation Engine (Numerical Methods)
    const slider = document.getElementById('x-slider');
    const xValDisplay = document.getElementById('x-val');
    const fxResult = document.getElementById('fx-result');
    const dxResult = document.getElementById('dx-result');

    // ฟังก์ชันที่เราต้องการทดสอบ f(x) = x^2 + 2x
    function f(x) {
        return (x * x) + (2 * x);
    }

    // ฟังก์ชันหาอนุพันธ์ (ความชัน) ด้วยระเบียบวิธีเชิงตัวเลข (Numerical Derivative)
    function getDerivative(x) {
        const h = 0.0001; // ค่าเข้าใกล้ศูนย์
        return (f(x + h) - f(x)) / h; 
    }

    // Fluid UI อัปเดตแบบเรียลไทม์
    slider.addEventListener('input', function() {
        const x = parseFloat(this.value);
        
        // 1. Data Kernel
        xValDisplay.textContent = x.toFixed(2);
        
        // 2. Computation Engine
        const fx = f(x);
        const dx = getDerivative(x);
        
        // 3. UI Update
        fxResult.textContent = fx.toFixed(2);
        dxResult.textContent = dx.toFixed(2);
    });
</script>

</body>
</html>
